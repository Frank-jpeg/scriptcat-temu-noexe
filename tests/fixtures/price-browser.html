<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生命周期核价测试（模拟数据）</title>
<style>body{font:16px/1.6 "Microsoft YaHei",sans-serif;background:#f5f6f8;margin:36px;color:#333}h1{font-size:22px}main{margin-left:700px;margin-top:140px;color:#888}</style>
<h1>生命周期核价测试</h1><p>仅模拟数据，所有业务请求已拦截，不会连接 TEMU。</p>
<main>模拟商品选择页 · 8 / 9 / 10 次核价</main>
<script>
    localStorage.setItem('agentseller-mall-info-id', 'test-mall');
    localStorage.setItem('goldabcd_noexe_config_v1', JSON.stringify({ version: 1, malls: [{ mallId: 'test-mall', mallName: '测试店铺', isSemiHosted: false }], priceReviewConfig: { normal: {}, disney: {}, sanrio: {}, priceMultiple: {} } }));
    window.fixture = { calls: [], logs: [], mode: 'success', rejected: new Set(), hold: null, release: null };
    window.addEventListener('goldabcd-noexe-log-event', e => fixture.logs.push(e.detail));
    window.confirm = () => true;
    window.fetch = async (url, options) => {
        if (!String(url).startsWith('https://agentseller.temu.com/api/')) throw new Error('模拟页面禁止外部请求');
        const body = JSON.parse(options.body);
        const call = { url, body, mall: options.headers.mallid };
        fixture.calls.push(call);
        if (url.includes('searchFor')) {
            const dataList = body.pageNum === 1 ? [8, 9, 10].filter(n => !fixture.rejected.has('order-' + n)).map(n => ({
                productId: 'p-' + n, productName: '测试商品 ' + n + ' 次核价 <img src=x onerror=alert(1)>', productPropertyList: [],
                skcList: [{ skcId: 'skc-' + n, supplierPriceReviewInfoList: [{ priceOrderId: 'order-' + n, times: n, status: 1,
                    supplyPrice: 1000, suggestSupplyPrice: 90, productSkuList: [{ skuId: 'sku-' + n, priceReviewStatus: 1, productPropertyList: [{ name: '颜色', value: '黑色' }] }] }] }]
            })) : [];
            return { ok: true, status: 200, json: async () => ({ success: true, result: { total: dataList.length, dataList } }) };
        }
        const order = body.priceOrderId || body.itemRequests?.[0]?.priceOrderId;
        if (url.endsWith('/no-bom/review') || body.itemRequests?.[0]?.supplierResult === 3) {
            if (fixture.mode === 'unknown') throw new Error('模拟网络中断');
            if (fixture.mode === 'failure') return { ok: true, status: 200, json: async () => ({ success: false, errorMsg: '模拟业务失败' }) };
            if (fixture.mode === 'hold') await new Promise(resolve => { fixture.release = resolve; });
            fixture.rejected.add(order);
        }
        return { ok: true, status: 200, json: async () => ({ success: true, result: {} }) };
    };
</script>
<script src="/price.js"></script><script src="/reject.js"></script></html>
